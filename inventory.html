<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <h1>Inventory Management</h1>
    <p>Monitor retail stock and reorder requirements</p>
</header>

<nav>
    <a href="/">Dashboard</a>
    <a href="/inventory">Inventory</a>
    <a href="/models">ML Models</a>
    <a href="/upload">Upload Dataset</a>
</nav>

<main>
    <section class="panel">
        <h2>Inventory Status</h2>

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Available Stock</th>
                    <th>Daily Sales</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Smart TV</td>
                    <td>120</td>
                    <td>18</td>
                    <td>Healthy</td>
                </tr>

                <tr>
                    <td>Winter Jacket</td>
                    <td>20</td>
                    <td>12</td>
                    <td>Low Stock</td>
                </tr>

                <tr>
                    <td>Wireless Earbuds</td>
                    <td>450</td>
                    <td>11</td>
                    <td>Overstock Review</td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
